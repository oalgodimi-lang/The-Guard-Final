name: Guard Final Sovereign Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Android Build Tools
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install "cython<3.0" buildozer kivy kivymd pillow

      - name: Build Sovereign APK
        run: |
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8
          # منع Buildozer من محاولة تحديث الأدوات لنسخ تجريبية غير مستقرة
          export BUILDOZER_ALLOW_ORG_NAME_ANYWHERE=1
          # الأمر السحري لقبول كافة التراخيص تلقائياً قبل بدء البناء
          yes | buildozer android debug
