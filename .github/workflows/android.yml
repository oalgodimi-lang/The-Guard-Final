name: Guard Final Sovereign Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Python 3.9
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          # تثبيت Cython أولاً وهو المفتاح المفقود
          pip install "cython<3.0" 
          pip install buildozer kivy

      - name: Build Sovereign APK
        run: |
          # إضافة تثبيت المتطلبات داخل السيرفر لضمان عدم نقص أي أداة
          buildozer android debug || true
          # سنستخدم هذا الأمر للتأكد من قبول الرخص
          yes | buildozer android debug
