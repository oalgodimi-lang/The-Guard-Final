name: Guard Final Sovereign Build
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Python 3.9
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install Android Build Tools
        run: |
          sudo apt update
          # قمنا بحذف libtinfo5 التي تسبب الخطأ وأضفنا المكتبات الأساسية فقط
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer kivy

      - name: Build Sovereign APK
        run: |
          # أمر "yes" لضمان الموافقة التلقائية على رخص الأندرويد
          yes | buildozer android debug
