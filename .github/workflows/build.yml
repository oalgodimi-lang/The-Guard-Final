name: Final Build
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip3 install --user --upgrade Cython==0.29.33 buildozer
      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
           buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: "yes"
      - uses: actions/upload-artifact@v4
        with:
          name: APK-File
          path: bin/*.apk
