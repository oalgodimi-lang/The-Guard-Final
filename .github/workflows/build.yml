name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04 # استخدام نسخة مستقرة ومجربة

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-setuptools git zip unzip
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy

      - name: Build with Buildozer
        run: |
          # قبول التراخيص عبر تمرير "y" بشكل مباشر ومنظم لأداة buildozer نفسها
          # هذه الطريقة تمنع Broken pipe وتضمن تحميل Aidl و SDK Manager تلقائياً
          yes | buildozer -v android debug
        env:
          # نترك لـ buildozer حرية إدارة المسارات لتجنب خطأ "sdkmanager not found"
          ACCEPT_SDK_LICENSE: "True"
