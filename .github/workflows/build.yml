name: Build APK v1.4.3 (Freedom Power)

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # حقنة الذاكرة القوية من ديب سيك
      _JAVA_OPTIONS: '-Xmx4096m -Xms1024m'
      PYTHONUNBUFFERED: 1

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-pip zip unzip
          pip3 install buildozer cython==0.29.33 kivy==2.3.0

      - name: Build with Buildozer
        run: |
          # تثبيت الأدوات يدوياً لضمان عدم حدوث Broken Pipe
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.0" "platforms;android-33"
          export PATH=$PATH:$ANDROID_HOME/build-tools/33.0.0
          # بناء صامت وقوي
          yes | buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "True"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: The-Guard-Final
          path: bin/*.apk
