name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-setuptools git zip unzip python3-pip

      - name: Install Python Tools
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy==2.3.0

      - name: Force Install Android Aidl
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.0" "platform-tools" "platforms;android-33"

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$ANDROID_HOME/build-tools/33.0.0
          yes | buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "True"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Guard-Sovereign-Final
          path: bin/*.apk
