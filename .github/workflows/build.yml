name: Build APK v1.4.4 (The Guard Final)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    
    env:
      # حقنة الذاكرة القوية لمنع الانهيار المفاجئ (Broken Pipe)
      _JAVA_OPTIONS: '-Xmx4096m -Xms1024m'
      PYTHONUNBUFFERED: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-pip zip unzip git
          pip3 install buildozer cython==0.29.33 kivy==2.3.0

      - name: Build with Buildozer (Clean & Build)
        run: |
          # 1. تطهير بقايا المحاولات السابقة لضمان عدم تضارب ملفات Gradle
          rm -rf .buildozer
          rm -rf ~/.buildozer
          
          # 2. تثبيت أدوات الأندرويد المطلوبة يدوياً
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.0" "platforms;android-33"
          export PATH=$PATH:$ANDROID_HOME/build-tools/33.0.0
          
          # 3. تنظيف بيئة بناء أندرويد قبل البدء (لحل خطأ gradlew failed)
          buildozer android clean
          
          # 4. الانطلاق في البناء النهائي
          yes | buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "True"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: The-Guard-Final-Package
          path: bin/*.apk
