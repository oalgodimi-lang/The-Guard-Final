name: Build APK v1.4.3

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JVM_HEAP_MEMORY: 4g  # إضافة العضلة التي اقترحها ديب سيك

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-pip zip unzip
          pip3 install buildozer cython==0.29.33 kivy==2.3.0

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$ANDROID_HOME/build-tools/33.0.0
          # البناء الصامت مع توجيه الخطأ فقط لو حدث
          yes | buildozer -q android debug
        env:
          ACCEPT_SDK_LICENSE: "True"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Guard-Final-v1.4.3
          path: bin/*.apk
