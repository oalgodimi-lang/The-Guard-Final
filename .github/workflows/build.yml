name: Build Guard 131
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      # 1. تنظيف عميق للسيرفر لتوفير مساحة للـ RAM (خطة القرين)
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost"
          sudo rm -rf /usr/local/lib/android /usr/local/share/powershell
          docker image prune -a -f

      # 2. بناء التطبيق باستخدام الأداة المعتمدة والمستقرة
      - name: Build with Buildozer
        uses: kivy/buildozer-action@master
        with:
          buildozer_version: master
          command: buildozer android debug
          repository_root: .
