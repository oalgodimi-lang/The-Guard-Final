name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          # تثبيت المكتبات الأساسية والضرورية للبناء على نظام Ubuntu الحديث
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-setuptools git zip unzip openjdk-17-jdk
          python -m pip install --upgrade pip
          # تحديد نسخة Cython لضمان استقرار Kivy كما ناقشنا
          pip install buildozer cython==0.29.33

      - name: Build with Buildozer
        # استخدمنا -v للحصول على تقرير مفصل ومنع انقطاع الاتصال (Broken pipe)
        # وأزلنا "yes |" لأنها تسبب مشاكل في بيئة GitHub
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Guard-Sovereign-Edition
          path: bin/*.apk
