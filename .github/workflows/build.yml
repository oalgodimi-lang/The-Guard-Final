name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-setuptools git zip unzip
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33 kivy

      # تم حقل هذا الجزء هنا لتوفير أداة Aidl المطلوبة لأندرويد 13
      - name: Install Android Aidl
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;33.0.0"

      - name: Build with Buildozer
        run: |
          # لضمان قبول التراخيص ومنع الـ Broken pipe
          yes | buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "True"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Guard-Sovereign-Edition
          # البحث في كل المجلدات لضمان إيجاد الملف بعد النجاح
          path: "**/*.apk"
