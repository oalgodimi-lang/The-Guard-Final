name: Build APK v1.4.7 (Lean & Fast)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    env:
      # تقليل الذاكرة المطلوبة لجافا لكي لا تصطدم بسقف النظام
      _JAVA_OPTIONS: '-Xmx2048m -Xms512m'
      PYTHONUNBUFFERED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-pip zip unzip
          pip3 install buildozer cython==0.29.33 kivy==2.3.0

      - name: Build with Buildozer
        run: |
          # 1. مسح يدوي خفيف للمجلدات المعطلة فقط
          [ -d ".buildozer/android/platform/build-arm64-v8a" ] && rm -rf .buildozer/android/platform/build-arm64-v8a || echo "Nothing to clear"
          
          # 2. البناء المباشر
          yes | buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "True"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: The-Guard-Final-Package
          path: bin/*.apk
