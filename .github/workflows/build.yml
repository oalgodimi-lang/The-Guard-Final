name: Build APK v1.4.5 (The Guard Ultimate)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    
    env:
      # قوة الذاكرة لمنع الانهيار المفاجئ (Broken Pipe)
      _JAVA_OPTIONS: '-Xmx4096m -Xms1024m'
      PYTHONUNBUFFERED: 1
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-pip zip unzip git
          pip3 install buildozer cython==0.29.33 kivy==2.3.0

      - name: Build with Buildozer
        run: |
          # 1. تثبيت أدوات الأندرويد المطلوبة لضمان المسارات الصحيحة
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.0" "platforms;android-33"
          export PATH=$PATH:$ANDROID_HOME/build-tools/33.0.0
          
          # 2. أمر التنظيف مع صمام أمان لتجنب خطأ FileNotFoundError
          buildozer android clean || echo "Environment already clean"
          
          # 3. البناء النهائي والقوي مع الذاكرة الكاملة
          yes | buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: "True"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: The-Guard-Final-Package
          path: bin/*.apk
